name: Update Repository

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y reprepro gnupg dpkg-dev
      
      - name: Import GPG
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --import --batch --yes
      
      - name: Build Packages
        run: |
          for dir in packages/*/; do
            if [ -d "$dir/DEBIAN" ]; then
              echo "Compiling deb file from directory: $dir"
              dpkg-deb --build "$dir"
            fi
          done
      
      - name: Upload Packages
        run: |
          if ls packages/*.deb 1> /dev/null 2>&1; then
            for deb in packages/*.deb; do
              reprepro includedeb trixie "$deb"
              rm "$deb"
            done
          fi
      
      - name: Publish Packages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages